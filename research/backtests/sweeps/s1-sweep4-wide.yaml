# S1 sweep 4 (2026-10-25): base w = v2 + vcp [2,6] + time stop off + SMA50 close exit + swing low 20 (s3-wide).
# Flat ladder, policy risk 0.25% x 6 positions (fills the 1.5% global open-risk cap). In-sample 2016..2021. Dated costs.
- label: w
  flat_ladder: true
  set:
    - "playbooks[default].setup.criteria[vcp].params.contractions=[2,6]"
    - "exits[time_stop].enabled=false"
    - "exits[close_below_sma].sma=50"
    - "exits[trailing_swing_low].lookback_days=20"
- label: w-nopartial
