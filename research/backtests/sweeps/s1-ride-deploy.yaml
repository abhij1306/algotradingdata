# Owner 2026-10-27: variations of ride (ride_pess 01a17d5e), one knob each against it. Each variant
# restates ride's own set lines (a run base needs them restated; rule 3).
# Ride sizes 1% risk on a median 6.3% stop, about 16% of equity per position. Cash runs out near 6
# positions: 359 signals refused size_zero_cash / size_below_min against 172 trades. The zero-cash
# ones averaged +0.86R gross over 60 days (01a17d5e refusals.csv).
# No industry-cap variant: a cap below max positions is refused while industries are incomplete
# (backtest_industry_cap_without_industries, app/hat/data/audit.py:694).
sweep_id: s1-ride-deploy
sweep_name: S1 ride variants - more capital deployed, lower drawdown, more trades (in-sample 2016-2021, policy v3)
variants:
- label: r075
  base: 01a17d5e-5176-728c-8c2a-39bc88acfb16
  change: risk per trade 1% -> 0.75% (about 12% positions, room for about 8)
  flat_ladder: true
  entry_bars: daily
  ambiguous: pessimistic
  policy_set: &id001
  - global_open_risk_pct=1
  - p_max.stage2-contraction-breakout=1
  set:
  - playbooks[default].setup.criteria[vcp].params.contractions=[2,6]
  - exits[time_stop].enabled=false
  - exits[close_below_sma].sma=50
  - exits[trailing_swing_low].lookback_days=20
  - exits[partial_at_r].enabled=false
  - playbooks[default].setup.criteria[vcp].params.dryup_vs_avg50=1.0
  - exits[step_trail].enabled=false
  risk_pct: 0.0075
- label: r050
  base: 01a17d5e-5176-728c-8c2a-39bc88acfb16
  change: risk per trade 1% -> 0.5% (about 8% positions, 10 slots fill about 80%)
  flat_ladder: true
  entry_bars: daily
  ambiguous: pessimistic
  policy_set: *id001
  set:
  - playbooks[default].setup.criteria[vcp].params.contractions=[2,6]
  - exits[time_stop].enabled=false
  - exits[close_below_sma].sma=50
  - exits[trailing_swing_low].lookback_days=20
  - exits[partial_at_r].enabled=false
  - playbooks[default].setup.criteria[vcp].params.dryup_vs_avg50=1.0
  - exits[step_trail].enabled=false
  risk_pct: 0.005
- label: r050_pos15
  base: 01a17d5e-5176-728c-8c2a-39bc88acfb16
  change: risk 0.5% and max positions 10 -> 15 (industry cap lifted to 15 with them)
  flat_ladder: true
  entry_bars: daily
  ambiguous: pessimistic
  policy_set: *id001
  set:
  - playbooks[default].setup.criteria[vcp].params.contractions=[2,6]
  - exits[time_stop].enabled=false
  - exits[close_below_sma].sma=50
  - exits[trailing_swing_low].lookback_days=20
  - exits[partial_at_r].enabled=false
  - playbooks[default].setup.criteria[vcp].params.dryup_vs_avg50=1.0
  - exits[step_trail].enabled=false
  risk_pct: 0.005
  max_positions: 15
  max_per_industry: 15
  bundle: true
  reason: half-size positions only add trades and invested capital if there are slots; the industry cap must not bind (industries incomplete)
- label: pmax15
